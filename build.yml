name: build-glory
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Clone ReShade
        run: git clone --recurse-submodules --depth 1 https://github.com/crosire/reshade.git reshade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - name: Apply Glory patch
        run: python patch_glory.py reshade
      - name: Build 64-bit
        run: msbuild reshade/ReShade.sln /m /p:Configuration=Release /p:Platform=64-bit
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $dll = Get-ChildItem reshade/bin -Recurse -Filter ReShade64.dll | Select-Object -First 1
          if (-not $dll) { Get-ChildItem reshade/bin -Recurse | Select-Object -First 60 FullName; throw "ReShade64.dll not found" }
          Copy-Item $dll.FullName out/dxgi.dll
          Copy-Item $dll.FullName out/Glory64.dll
          Copy-Item Glory.ini out/Glory.ini
          Copy-Item -Recurse glory-shaders out/glory-shaders
          New-Item -ItemType Directory -Force out/glory-shaders/Textures | Out-Null
          Get-ChildItem out -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Glory
          path: out
